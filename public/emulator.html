<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroPlay Emulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    #game { width: 100%; height: 100%; }
    #no-rom {
      display: none;
      width: 100%; height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ff00ff;
      text-align: center;
      padding: 20px;
    }
    #no-rom .icon { font-size: 48px; }
    #no-rom .title { font-size: 14px; letter-spacing: 2px; text-shadow: 0 0 10px #ff00ff; }
    #no-rom .sub { font-size: 10px; color: #555; max-width: 300px; line-height: 1.8; }
  </style>
  <script>
    var params  = new URLSearchParams(window.location.search);
    var core    = params.get('core') || 'snes';
    var romUrl  = params.get('rom')  || '';

    // Make relative proxy URLs absolute for EmulatorJS
    if (romUrl && romUrl.startsWith('/')) {
      romUrl = window.location.origin + romUrl;
    }

    if (!romUrl || romUrl.includes('PLACEHOLDER')) {
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('game').style.display = 'none';
        var el = document.getElementById('no-rom');
        el.style.display = 'flex';
      });
    } else {
      // Stub WakeLock
      try {
        Object.defineProperty(navigator, 'wakeLock', {
          value: {
            request: function() {
              return Promise.resolve({
                released: false, type: 'screen',
                release: function() { return Promise.resolve(); },
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              });
            }
          },
          configurable: true, writable: true
        });
      } catch(e) {
        try { navigator.wakeLock = { request: function() { return Promise.resolve({ released: false, type: 'screen', release: function() { return Promise.resolve(); }, addEventListener: function() {}, removeEventListener: function() {}, dispatchEvent: function() { return true; } }); } }; } catch(e2) {}
      }

      window.EJS_player        = '#game';
      window.EJS_core          = core;
      window.EJS_gameUrl       = romUrl;
      window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_color         = '#00ffff';
      window.EJS_gamepadEnabled = true;
    }
  </script>
  <script>
    // Only load EmulatorJS if we have a ROM
    var _romCheck = new URLSearchParams(window.location.search).get('rom') || '';
    if (_romCheck && !_romCheck.includes('PLACEHOLDER')) {
      document.write('<scr' + 'ipt src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/scr' + 'ipt>');
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="no-rom">
    <div class="icon">🎮</div>
    <div class="title">ROM NOT LOADED</div>
    <div class="sub">No ROM file is configured for this game yet.</div>
  </div>
</body>
</html>
